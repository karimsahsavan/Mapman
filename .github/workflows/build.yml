
name: ShikDialer APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ShikDialer
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ShikDialer ZIP
        shell: bash
        run: |
          set -e

          if [ -f ShikDialer.zip ]; then
            mkdir -p extracted
            unzip -oq ShikDialer.zip -d extracted
            echo "ZIP extracted."
          elif [ -f settings.gradle.kts ]; then
            echo "Project already extracted."
          else
            echo "ERROR: ShikDialer.zip not found."
            exit 1
          fi

      - name: Find Project
        shell: bash
        run: |
          set -e

          FILE=$(find . -maxdepth 8 \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          DIR=$(dirname "$FILE")

          if [ ! -f "$DIR/app/build.gradle.kts" ] &&
             [ ! -f "$DIR/app/build.gradle" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project found: $DIR"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Starting ShikDialer build..."

          gradle --version

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK GENERATED SUCCESSFULLY"
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShikDialer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ShikDialer-Build-Logs
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
