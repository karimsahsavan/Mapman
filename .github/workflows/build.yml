
name: Build Galaxy Dialer Pro

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          unzip -o GalaxyDialerPro_GitHub_Project.zip -d extracted

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find extracted -type f -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyDialerPro-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
