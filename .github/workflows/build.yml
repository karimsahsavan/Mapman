
name: ShikDialer APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ShikDialer APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Project
        shell: bash
        run: |
          set -e

          if [ -f ShikDialer.zip ]; then
            mkdir -p extracted
            unzip -oq ShikDialer.zip -d extracted
          fi

          PROJECT_FILE=$(find . -maxdepth 8 \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK is unavailable."
            exit 1
          fi

          ls "$ANDROID_HOME/platforms"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK CREATED SUCCESSFULLY"
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShikDialer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ShikDialer-Error-Log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
