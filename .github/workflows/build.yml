
name: Build Galaxy Dialer Pro

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          unzip -o GalaxyDialerPro_GitHub_Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/GalaxyDialerPro
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyDialerPro-APK
          path: extracted/GalaxyDialerPro/app/build/outputs/apk/debug/app-debug.apk
