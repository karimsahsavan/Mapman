
name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ShikDialer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate project
        shell: bash
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERROR: Gradle project not found in repository root."
            find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \)
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShikDialer-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
